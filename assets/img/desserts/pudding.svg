<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="puddingBody" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF5D6"/>
      <stop offset="100%" stop-color="#FFE4A0"/>
    </linearGradient>
    <linearGradient id="caramelTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#BA6F33"/>
      <stop offset="100%" stop-color="#8F4916"/>
    </linearGradient>
    <filter id="puddingGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#FFE4A0" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#puddingGlow)">
    <!-- Plate -->
    <ellipse cx="50" cy="85" rx="42" ry="8" fill="#E8DEFF" stroke="#CBB7F5" stroke-width="1.5"/>
    <ellipse cx="50" cy="84" rx="35" ry="6" fill="#FFFFFF" opacity="0.6"/>
    <!-- Pudding Custard Body -->
    <path d="M30 40 L22 80 C22 84 35 87 50 87 C65 87 78 84 78 80 L70 40 Z" fill="url(#puddingBody)"/>
    <!-- Caramel Sauce Top with Droplets -->
    <path d="M30 40 C30 36 39 34 50 34 C61 34 70 36 70 40 C70 43 67 45 65 47 C63 50 63 55 61 58 C59 55 58 48 55 46 C52 49 51 54 49 56 C47 53 45 46 43 45 C41 49 39 52 37 54 C35 50 33 46 30 40 Z" fill="url(#caramelTop)"/>
    <!-- Caramel Top Highlight -->
    <ellipse cx="48" cy="37" rx="14" ry="2.5" fill="#E08B48" opacity="0.7"/>
    <!-- Mint leaf topping & cherry -->
    <circle cx="50" cy="27" r="5.5" fill="#FF5C8D"/>
    <circle cx="48" cy="25" r="1.5" fill="#FFFFFF" opacity="0.8"/>
    <path d="M54 26 C60 20 64 24 62 28 C57 28 54 27 54 26 Z" fill="#9AEBA3"/>
  </g>
</svg>
