<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="donutDough" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE2B8"/>
      <stop offset="100%" stop-color="#F7C582"/>
    </linearGradient>
    <linearGradient id="donutGlaze" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CBB7F5"/>
      <stop offset="100%" stop-color="#A2D2FF"/>
    </linearGradient>
    <filter id="donutGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#A2D2FF" flood-opacity="0.35"/>
    </filter>
  </defs>
  <g filter="url(#donutGlow)">
    <!-- Dough base -->
    <circle cx="50" cy="50" r="38" fill="url(#donutDough)"/>
    <!-- Glaze with wavy drips -->
    <path d="M50 14 C60 14 70 18 78 26 C86 34 87 45 84 55 C82 62 76 68 76 74 C73 80 62 84 55 83 C47 86 37 84 31 79 C24 75 20 68 18 60 C15 50 16 38 23 29 C30 20 40 14 50 14 Z" fill="url(#donutGlaze)"/>
    <!-- Glaze shine -->
    <path d="M30 25 C40 18 60 18 70 25" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Donut Hole -->
    <circle cx="50" cy="50" r="14" fill="#F8F9FE"/>
    <!-- Dough inner shadow/edge -->
    <circle cx="50" cy="50" r="14" stroke="#E2B170" stroke-width="2" fill="none"/>
    <!-- Colorful Sprinkles -->
    <!-- Pink Sprinkles -->
    <line x1="33" y1="35" x2="38" y2="33" stroke="#FF8EC2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="62" y1="28" x2="67" y2="31" stroke="#FF8EC2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="68" y1="65" x2="74" y2="62" stroke="#FF8EC2" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="30" y1="62" x2="35" y2="66" stroke="#FF8EC2" stroke-width="2.5" stroke-linecap="round"/>
    <!-- White Sprinkles -->
    <line x1="45" y1="24" x2="51" y2="24" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="72" y1="46" x2="76" y2="50" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="46" y1="74" x2="52" y2="73" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="22" y1="47" x2="27" y2="45" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round"/>
    <!-- Yellow Sprinkles -->
    <line x1="57" y1="36" x2="62" y2="39" stroke="#FFE49E" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="38" y1="72" x2="41" y2="67" stroke="#FFE49E" stroke-width="2.2" stroke-linecap="round"/>
    <line x1="60" y1="72" x2="64" y2="68" stroke="#FFE49E" stroke-width="2.2" stroke-linecap="round"/>
  </g>
</svg>
