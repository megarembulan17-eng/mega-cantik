<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="coneGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE1B4"/>
      <stop offset="100%" stop-color="#E5AD6B"/>
    </linearGradient>
    <linearGradient id="swirlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9E0FF"/>
      <stop offset="45%" stop-color="#CBB7F5"/>
      <stop offset="80%" stop-color="#A2D2FF"/>
      <stop offset="100%" stop-color="#BDE0FE"/>
    </linearGradient>
    <filter id="iceGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#A2D2FF" flood-opacity="0.3"/>
    </filter>
  </defs>
  <g filter="url(#iceGlow)">
    <!-- Waffle Cone -->
    <polygon points="32,54 68,54 50,94" fill="url(#coneGrad)" stroke="#D49953" stroke-width="1.5" stroke-linejoin="round"/>
    <!-- Waffle Grid Lines -->
    <path d="M38 60 L62 84 M46 56 L58 78 M42 74 L55 58 M47 85 L65 65" stroke="#C88E4B" stroke-width="1.2" stroke-linecap="round" opacity="0.6"/>
    <!-- Soft Serve Swirl Tiers -->
    <!-- Bottom Swirl -->
    <path d="M26 53 C26 47 34 46 38 48 C42 45 50 44 54 48 C58 45 66 46 72 50 C74 54 70 56 66 56 L34 56 C28 56 26 55 26 53 Z" fill="url(#swirlGrad)"/>
    <!-- Middle Swirl -->
    <path d="M30 45 C30 38 38 36 43 38 C48 35 55 35 60 38 C68 39 70 47 62 47 L36 47 C32 47 30 46 30 45 Z" fill="#D7C7FC"/>
    <!-- Upper Swirl -->
    <path d="M36 36 C36 29 44 26 50 27 C56 26 62 29 60 36 Z" fill="#E8DEFF"/>
    <!-- Swirl Tip -->
    <path d="M47 26 C47 20 54 13 52 11 C48 15 48 20 48 26 Z" fill="#FFAFCC"/>
    <!-- Cherry on top side -->
    <circle cx="58" cy="18" r="4.5" fill="#FF5C8D"/>
    <!-- Cute Sprinkles -->
    <circle cx="42" cy="42" r="1.5" fill="#FF8EC2"/>
    <circle cx="56" cy="43" r="1.5" fill="#FFE27A"/>
    <circle cx="48" cy="33" r="1.3" fill="#70B6F6"/>
  </g>
</svg>
