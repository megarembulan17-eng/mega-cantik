<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <linearGradient id="candyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB3D9"/>
      <stop offset="40%" stop-color="#D7C7FC"/>
      <stop offset="100%" stop-color="#A2D2FF"/>
    </linearGradient>
    <filter id="candyGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#D7C7FC" flood-opacity="0.4"/>
    </filter>
  </defs>
  <g filter="url(#candyGlow)" transform="rotate(-15 50 50)">
    <!-- Left Wrapper -->
    <path d="M30 50 L10 32 C8 30 5 35 7 42 L12 50 L7 58 C5 65 8 70 10 68 L30 50 Z" fill="#FFAFCC" stroke="#FF8EC2" stroke-width="1.2"/>
    <!-- Right Wrapper -->
    <path d="M70 50 L90 32 C92 30 95 35 93 42 L88 50 L93 58 C95 65 92 70 90 68 L70 50 Z" fill="#BDE0FE" stroke="#70B6F6" stroke-width="1.2"/>
    <!-- Candy Center Body -->
    <circle cx="50" cy="50" r="24" fill="url(#candyGrad)"/>
    <!-- Swirl Stripes -->
    <path d="M32 40 Q50 32 68 40" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <path d="M30 50 Q50 42 70 50" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" fill="none" opacity="0.7"/>
    <path d="M34 60 Q50 52 66 60" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" fill="none" opacity="0.6"/>
    <!-- Ribbon ties -->
    <ellipse cx="28" cy="50" rx="3" ry="7" fill="#FF8EC2"/>
    <ellipse cx="72" cy="50" rx="3" ry="7" fill="#70B6F6"/>
  </g>
</svg>
